<style>
  :root { color-scheme: light; }
  :root { --bg:#FFFFFF; --card:#FFFFFF; --ice:#FBF8F1; --tint:#FBF8F1; --alab:#FAF9F6; --line:#EAE4D3; --text:#2C2A25; --dim:#7A7466; --gold:#B8860B; --champ:#D4AF37; --buy:#0E9F6E; --sell:#DC2626;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --font: Inter, ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; overflow:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  a { color:var(--gold); text-decoration:none; } a:hover { text-decoration:underline; }
  .app { height:100vh; height:100dvh; display:flex; flex-direction:column; }

  /* top bar: one compact CMC-style row */
  .top { flex:none; height:48px; display:flex; align-items:center; gap:22px; padding:0 24px; background:#FFFFFF; border-bottom:1px solid #EAE4D3; white-space:nowrap; overflow:hidden; }
  .brand { font-weight:800; font-size:16px; letter-spacing:.6px; color:#B8860B; }
  .tick { display:flex; align-items:center; justify-content:space-between; gap:8px; flex:1 1 0; min-width:0; overflow:hidden; flex-wrap:nowrap; font-size:12.5px; }
  .tk { flex:none; display:inline-flex; align-items:center; gap:6px; border:1px solid #EAE4D3; border-radius:20px; padding:4px 10px; background:#FFFFFF; color:#2C2A25; white-space:nowrap; cursor:pointer; transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .12s ease, background-color .12s ease; -webkit-tap-highlight-color:transparent; }
  .tk:hover { background:#FBF8F1; border-color:#D4AF37; }
  .tk:active { transform:translateY(2px) scale(.985); transition-duration:.08s; transition-timing-function:cubic-bezier(.2,0,0,1); }
  .tk b { font-weight:800; color:#B8860B; } .tk .px { font-family:var(--mono); font-weight:600; color:#2C2A25; } .tk .ch { font-size:11px; font-weight:700; }
  .cico { width:22px; height:22px; border-radius:50%; flex:none; object-fit:cover; display:block; background:#FFFFFF; }
  .cico.fb { display:inline-flex; background:transparent; } .cico.fb svg { display:block; }
  .pxs { display:inline-block; width:46px; height:11px; border-radius:4px; background:linear-gradient(90deg,#F4F0E4,#FAF9F6,#F4F0E4); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  .up { color:var(--buy); } .dn { color:var(--sell); }
  .lang { display:flex; gap:2px; font-size:13px; font-weight:700; background:#FBF8F1; border:1px solid #EAE4D3; border-radius:9999px; padding:2px; }
  .lang button { padding:4px 8px; color:var(--dim); } .lang button { border-radius:9999px; }
  .lang button[aria-pressed="true"] { color:#B8860B; background:#FFFFFF; box-shadow:0 0 0 1px #D4AF37 inset; }

  /* split screen */
  .split { flex:1 1 auto; min-height:0; width:100%; max-width:1640px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:24px; }
  .panel { min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .phead { flex:none; display:flex; align-items:center; gap:10px; padding:12px 16px 4px; }
  .coin { color:#B8860B; } .coin:hover { color:#C59B27; } .phead h2 { margin:0; font-size:15px; font-weight:800; color:#B8860B; letter-spacing:.3px; }
  .phead .sub { font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; }
  .phead .st { margin-left:auto; flex:none; font-size:11px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--buy); } .dot.slow { background:var(--sell); } .dot.wait { background:#D4AF37; }
  .ai { flex:none; margin:8px 16px 10px; padding:10px 14px; border:1px solid #EAE4D3; border-left:3px solid #D4AF37; border-radius:8px; background:#FAF9F6; font-size:13px; line-height:1.5; }
  .ai .t { display:block; color:var(--gold); font-weight:800; font-size:12px; letter-spacing:.5px; margin-bottom:4px; }
  .ai .in { color:var(--buy); font-weight:700; } .ai .out { color:var(--sell); font-weight:700; }
  .scroll { flex:1 1 auto; min-height:0; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
  th { position:sticky; top:0; z-index:1; background:var(--card); color:var(--dim); text-align:left; font-size:11.5px; font-weight:700; letter-spacing:.4px; padding:11px 16px; border-bottom:1px solid var(--line); border-top:1px solid var(--line); white-space:nowrap; }
  td { padding:16px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th.r, td.r { text-align:right; }
  tbody tr:hover td { background:#FBF8F1; }
  .mono { font-family:var(--mono); font-size:13px; }
  .coin { font-weight:800; display:inline-flex; align-items:center; gap:6px; } .coin:hover { color:var(--gold); }
  .coin i { font-style:normal; font-size:12px; opacity:.65; }
  .net { font-size:10.5px; color:var(--dim); margin-left:6px; font-weight:600; }
  .act { display:inline-block; padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:700; letter-spacing:.4px; }
  .act.buy { color:var(--buy); background:#ECFDF5; } .act.sell { color:var(--sell); background:#FEF2F2; }
  .sig { font-size:11px; font-weight:700; letter-spacing:.4px; color:var(--dim); } .sig.mm { color:#B8860B; background:#FBF8F1; border:1px solid #D4AF37; padding:2px 9px; border-radius:9999px; }
  .rk { display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:22px; padding:0 6px; border-radius:9999px; font-size:12px; font-weight:700; color:var(--dim); }
  .rk.t3 { background:#FBF8F1; border:1px solid #D4AF37; color:#B8860B; }
  .fund { font-weight:700; } .dim { color:var(--dim); }
  .skel td > span { display:inline-block; height:12px; width:70%; border-radius:4px; background:linear-gradient(90deg,#F4F0E4,#FAF9F6,#F4F0E4); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .msg { padding:22px 16px; color:var(--dim); font-size:13px; line-height:1.5; white-space:normal; }
  .foot { flex:none; padding:6px 20px 8px; font-size:11px; color:var(--dim); border-top:1px solid var(--line); line-height:1.4; max-height:2.9em; overflow:hidden; }

  /* 1H chart drawer */
  .drawer { position:fixed; left:0; right:0; bottom:0; z-index:30; height:48vh; min-height:280px; display:flex; flex-direction:column; background:var(--card); border-top:1px solid #EAE4D3; border-radius:16px 16px 0 0; box-shadow:0 -12px 32px rgba(44,42,37,.14); animation:up .22s ease-out; }
  .drawer[hidden] { display:none; }
  @keyframes up { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
  body.chart-open .scroll { padding-bottom:48vh; }
  .dhead { flex:none; display:flex; align-items:center; gap:12px; padding:8px 16px; font-size:13px; white-space:nowrap; overflow:hidden; border-bottom:1px solid var(--line); }
  .dhead .s { font-weight:800; font-size:16px; color:#B8860B; } .dhead .m { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; } .dhead .sp { flex:1 1 auto; }
  .dhead a, .dhead button { color:var(--text); font-size:12px; font-weight:700; padding:3px 4px; } .dhead a:hover, .dhead button:hover { color:var(--gold); text-decoration:none; }
  .dbody { flex:1 1 auto; min-height:0; position:relative; background:var(--bg); }
  .dbody iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .dmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; color:var(--dim); }

  @media (max-width:980px) { html, body { overflow:auto; } .app { height:auto; min-height:100vh; } .split { grid-template-columns:1fr; } .panel { max-height:80vh; } }

  /* ---- 24K gold panels: obsidian-black text, deep burnished header ---- */
  .panel { --text:#0F0D08; --dim:#3D3418; --gold:#0F0D08; --line:rgba(15,13,8,.24); --buy:#0A7B54; --sell:#B91C1C; --ice:rgba(255,252,240,.40);

async function fetchJSON(url, ms) {
  let timer;

  try {
    const res = await Promise.race([fetch(url), timeout]);

    try { const d = await fetchJSON(url, ms); try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d })); } catch (e) {} return d; }
