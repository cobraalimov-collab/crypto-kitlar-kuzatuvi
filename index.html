<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

<style>
  /* Light work area (table, notice, footer) under a dark top panel (header + filters).
     The variables below are the light set; .hdr/.tools re-declare them dark. */
  :root, html[data-theme="gold"] {
    --bg: #FFFFFF; --panel: #FFFFFF; --hover: #F8F9FA; --chip: #F1F2F4; --text: #111111; --muted: #4B5563;
    --grid: #E5E5E5; --rowline: #EEEEEE; --logo: #FFFFFF; --logo-glow: rgba(255, 255, 255, 0.28);
    --gold: #F7A600; --gold-text: #B87800;
    --hdr-bg: #FFFDF7; --hdr-text: #374151; --hdr-line: #F7A600;
    --btn: #F7A600; --btn-text: #000000; --btn-hover: #FFB92E;
    --act-bg: rgba(247, 166, 0, 0.16); --act-text: #F7A600;
    --bar: rgba(247, 166, 0, 0.32); --barEnd: rgba(247, 166, 0, 0.07);
    --buy: #20B26C; --sell: #EF454A; --buy-bg: rgba(32, 178, 108, 0.12); --sell-bg: rgba(239, 69, 74, 0.12);
  }
  .hdr, .tools {
    --bg: #0B0B0B; --panel: #0B0B0B; --hover: #1B1D21; --chip: #1D1F24; --text: #F7931A; --muted: #F7931A;
    --grid: #26282D; --gold-text: #F7A600; --act-bg: rgba(247, 166, 0, 0.14);
    color: var(--text);
  }
  :root {
    --brand: #F7A600;
    --font: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }

  /* ---- shell: full viewport, header / filters / table / footer ---- */
  .app { width: 100vw; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .hdr, .tools { flex: none; display: flex; align-items: center; flex-wrap: nowrap; white-space: nowrap; overflow-x: auto; scrollbar-width: none; background: var(--panel); border-bottom: 1px solid var(--grid); }
  .hdr::-webkit-scrollbar, .tools::-webkit-scrollbar { display: none; }
  .hdr { justify-content: space-between; gap: 16px; padding: 0 24px; height: 64px; }
  /* Twin capsules: logo and title share one identical pill spec (solid orange, black content). */
  .logo, .tagline {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    height: 40px; padding: 8px 24px; border: none; border-radius: 9999px; background-color: #F7931A;
    font-family: "Montserrat", "Inter", ui-sans-serif, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px; font-weight: 800; letter-spacing: 0.5px; line-height: 1; color: #0B0B0B;
    white-space: nowrap; user-select: none; flex: none;
  }
  .logo { text-transform: none; text-shadow: none; gap: 0; }
  .logo .hi { color: #0B0B0B; text-shadow: none; }
  .tagline { text-transform: uppercase; }
  .tagline .whale { height: 24px; width: auto; flex: none; display: block; }
  .tagline .whale path { fill: #0B0B0B; }
  .tagline .ttl { font: inherit; letter-spacing: inherit; color: #0B0B0B; }
  .tagline .ttl span { color: #0B0B0B; }
  .tagline .w2, .tagline .w3 { margin-left: 0.4em; }
  @media (max-width: 1300px) { .live { display: none; } }
  @media (max-width: 900px) { .tagline { display: none; } }
  .tools { gap: 8px 4px; padding: 8px 16px; min-height: 60px; flex-wrap: wrap; white-space: normal; overflow: visible; }

  .brand { display: flex; align-items: center; gap: 12px; flex: none; }
  .live { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 6px; background: var(--chip); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--buy); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(32, 178, 108, 0.55); } 70% { box-shadow: 0 0 0 7px rgba(32, 178, 108, 0); } 100% { box-shadow: 0 0 0 0 rgba(32, 178, 108, 0); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

  .right { display: flex; align-items: center; gap: 16px; flex: none; }

  .grp { display: flex; gap: 2px; flex: none; }
  .sep { width: 1px; height: 22px; background: var(--grid); flex: none; margin: 0 4px; }
  /* chips: flat, 6px radius, tinted when active (Bybit filter style) */
  .pill {
    border: 0; background: transparent; color: var(--muted); border-radius: 6px;
    padding: 8px 8px; font: inherit; font-size: 12.5px; font-weight: 500; line-height: 1.2; cursor: pointer; flex: none; transition: background .12s, color .12s;
  }
  .pill:hover { background: var(--chip); color: var(--text); }
  .pill[aria-pressed="true"], .pill[aria-pressed="true"]:hover { background: #F7931A; color: #000000 !important; border: none; border-radius: 9999px; font-weight: 800; }
  .lang .pill { padding: 6px 10px; font-size: 12px; letter-spacing: 0.04em; }
  .spacer { flex: 1 1 auto; min-width: 8px; }
  .pill.sort { background: var(--chip); color: var(--text); font-weight: 600; }
  .pill.sort:hover { background: var(--act-bg); color: var(--act-text); }
  .gbtn {
    border: 0; background: var(--btn); color: var(--btn-text); border-radius: 8px;
    padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
    display: inline-block; flex: none; white-space: nowrap; line-height: 1.2; transition: background .12s;
  }
  .gbtn:hover { background: var(--btn-hover); }
  .gbtn[disabled] { opacity: .5; cursor: default; }

  .notice { flex: none; display: none; padding: 9px 24px; font-size: 12.5px; background: var(--act-bg); color: var(--text); border-bottom: 1px solid var(--grid); }
  .notice.show { display: block; }

  /* ---- table: no vertical dividers, hairline rows, sticky muted header with gold underline ---- */
  .grid { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--bg); padding: 10px 12px 0; }
  table { width: 100%; min-width: 1350px; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 14px; font-variant-numeric: tabular-nums; }
  col.c0 { width: 64px; } col.c1 { width: 132px; } col.c3 { width: 290px; } col.c4 { width: 172px; }
  col.c5 { width: 192px; } col.c6 { width: 188px; } col.c7 { width: 150px; }
  th, td { padding: 0 14px; height: 56px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--rowline); }
  /* header row: solid orange rounded bar with black bold labels */
  thead th {
    position: sticky; top: 0; z-index: 2; height: 40px; background: #F7931A; color: #000000;
    font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; border-bottom: none;
    box-shadow: 0 -10px 0 var(--bg);
  }
  thead th:first-child { border-radius: 9999px 0 0 9999px; padding-left: 28px; }
  thead th:last-child { border-radius: 0 9999px 9999px 0; padding-right: 28px; }
  .num { text-align: right; }
  tbody tr:hover td { background: var(--hover); }
  .mono { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .rank { font-family: var(--mono); font-weight: 600; color: var(--muted); }
  .rank.top { color: var(--gold-text); }
  .badge { display: inline-block; min-width: 96px; text-align: center; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; }
  .badge.buy { background: var(--buy-bg); color: var(--buy); }
  .badge.sell { background: var(--sell-bg); color: var(--sell); }
  .sym { font-weight: 600; font-size: 15px; }
  .tag { margin-left: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; color: var(--muted); background: var(--chip); }
  /* USD cell: soft gold bar behind the number = size relative to the #1 trade */
  td.usd { position: relative; padding: 0; }
  td.usd .fill { position: absolute; left: 0; top: 8px; bottom: 8px; border-radius: 0 4px 4px 0; background: linear-gradient(90deg, var(--bar), var(--barEnd)); }
  td.usd .amt { position: relative; display: block; padding: 0 14px; line-height: 56px; text-align: right; font-family: var(--mono); font-size: 14.5px; font-weight: 600; }
  .act { text-align: right; }
  @media (max-width: 1580px) { .tools { padding: 8px 12px; } .tools .pill { padding: 8px 6px; font-size: 12px; } .tools .sep { margin: 0 2px; } .tools .gbtn { padding: 8px 12px; } }
  .addr { color: var(--text); text-decoration: none; margin-right: 8px; }
  a.addr:hover { color: #B87800; text-decoration: underline; }
  .src { display: inline-block; padding: 3px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; vertical-align: middle; }
  .src.dex { background: #EEF0F3; color: #374151; }
  .src.cex { background: #111111; color: #F7931A; }
  .src.smart { background: #F7931A; color: #000000; margin-right: 8px; letter-spacing: 0.04em; }
  .fund { font-weight: 800; margin-right: 6px; }
  .fundaddr { display: block; margin-top: 2px; font-size: 11px; }
  .fundaddr .addr { margin: 0; color: #4B5563; }
  tr.smart td:first-child { box-shadow: inset 3px 0 0 #F7931A; }
  .newtag { margin-left: 8px; padding: 2px 7px; border-radius: 9999px; background: #10B981; color: #000000; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; vertical-align: middle; }
  .muted { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); height: 120px; white-space: normal; }


  /* ---- AI whale radar: dark card between the filter bar and the table ---- */
  .radarwrap { flex: none; padding: 12px 12px 0; background: var(--bg); }
  .radar { background: #0F0F12; border: 1px solid rgba(247, 147, 26, 0.4); border-radius: 12px; padding: 12px 16px; color: #FFFFFF; }
  .rhead { display: flex; align-items: center; gap: 14px; white-space: nowrap; overflow: hidden; }
  .rlive { display: inline-flex; align-items: center; gap: 8px; flex: none; padding: 5px 12px; border-radius: 9999px; background: rgba(247, 147, 26, 0.12); color: #F7931A; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; }
  .rdot { width: 7px; height: 7px; border-radius: 50%; background: #F7931A; animation: blink2 1.4s ease-in-out infinite; }
  @keyframes blink2 { 0%, 100% { opacity: 1; box-shadow: 0 0 8px 1px rgba(247, 147, 26, 0.7); } 50% { opacity: 0.25; box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { .rdot { animation: none; } }
  .rtitle { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: #A7ADB6; }
  .rtitle b { color: #F7931A; font-weight: 800; letter-spacing: 0.04em; }
  .rspan { flex: none; font-size: 11.5px; color: #8E949C; font-variant-numeric: tabular-nums; }
  .rcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .rcol { background: #17181C; border: 1px solid #26282D; border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .rcol.in { border-top: 2px solid #10B981; } .rcol.out { border-top: 2px solid #F6465D; }
  .rcoltitle { font-size: 11.5px; font-weight: 800; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rcol.in .rcoltitle { color: #10B981; } .rcol.out .rcoltitle { color: #F6465D; }
  .rlist { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  button.rcoin { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: 0; border-radius: 8px; padding: 5px 8px; color: #FFFFFF; font: inherit; cursor: pointer; text-align: left; }
  button.rcoin:hover { background: #22252B; }
  button.rcoin.on { background: rgba(247, 147, 26, 0.18); box-shadow: inset 0 0 0 1px #F7931A; }
  .rcoin .rk { width: 24px; flex: none; color: #F7931A; font-family: var(--mono); font-size: 12px; font-weight: 700; }
  .rcoin .nm { min-width: 64px; font-size: 14px; font-weight: 800; }
  .rcoin .cnt { flex: 1 1 auto; min-width: 0; font-size: 12px; color: #A7ADB6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rcoin .pct { flex: none; width: 52px; text-align: right; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #D1D5DB; }
  .rcoin .amt { flex: none; padding: 3px 12px; border-radius: 9999px; font-family: var(--mono); font-size: 13px; font-weight: 800; }
  .rcoin .amt.g { background: #10B981; color: #000000; } .rcoin .amt.r { background: #F6465D; color: #FFFFFF; }
  .rclear { flex: none; padding: 4px 12px; border: 0; border-radius: 9999px; background: #F7931A; color: #000000; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
  .rsum { margin-top: 10px; padding-top: 8px; border-top: 1px solid #26282D; font-size: 13px; line-height: 1.45; color: #F7931A; font-weight: 600; }
  .rempty { padding: 8px; font-size: 13px; color: #A7ADB6; }
  @media (max-width: 900px) { .rcols { grid-template-columns: 1fr; } .rspan { display: none; } }
  @media (max-height: 820px) { .rlist button.rcoin:nth-child(n+4) { display: none; } }
  @media (max-height: 620px) { .radarwrap { display: none; } }

  /* ---- status footer ---- */
  .foot { flex: none; border-top: 1px solid var(--grid); background: var(--panel); padding: 8px 24px; font-size: 11.5px; color: var(--muted); }
  .foot .row { display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; overflow: hidden; }
  .note { margin-top: 3px; line-height: 1.45; white-space: normal; max-height: 3em; overflow: hidden; }

  @media (max-width: 720px) {
    .live span.t { display: none; } .live { padding: 7px; }
    .hdr, .tools { padding: 0 12px; } .foot { padding: 8px 12px; } .note { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hdr" id="hdr"></header>
  <nav class="tools" id="tools"></nav>
  <section class="radarwrap"><div class="radar" id="radar"></div></section>
  <div class="notice" id="notice" role="status"></div>
  <main class="grid">
    <table>
      <colgroup><col class="c0"><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"><col class="c7"></colgroup>

      <tbody id="rows"></tbody>

  <footer class="foot">
    <div class="row"><span id="statusL"></span><span id="statusR"></span></div>
    <div class="note" id="note"></div>
  </footer>
</div>

<script>
/* ============================================================== config / i18n */

const SMART_MIN = 1000000;        // smart-money floor ($1M) used by the default view and by the AI radar

   Add more as  'address': 'Name'  (EVM addresses lower-case, Solana addresses exact). */

  // 'ADDRESS': 'Abraxas Capital',
};
const smartName = (w) => (w && (SMART_WALLETS[w] || SMART_WALLETS[w.toLowerCase()])) || '';

const POOLS_PER_CHAIN = 30;        // top-30 pools by liquidity per network
const TRADES_PER_CYCLE = 5;       // 5 calls / 12s + discovery stays under GeckoTerminal's public ~30/min limit
const GT = 'https://api.geckoterminal.com/api/v2';

const CHAINS = {
  solana:   { gt: 'solana', tag: 'SOL',  explorer: 'https://solscan.io/tx/',   addr: 'https://solscan.io/account/', hash: /^[1-9A-HJ-NP-Za-km-z]{60,100}$/ },
  ethereum: { gt: 'eth',    tag: 'ETH',  explorer: 'https://etherscan.io/tx/', addr: 'https://etherscan.io/address/', hash: /^0x[0-9a-fA-F]{64}$/ },

const OKX_GAP_MS = 50;            // fills of one taker order land within a few ms: merge them into one trade

const isCex = (chain) => chain === 'okx';

const I18N = {

    sources: ['Barcha manbalar', 'Shaxsiy hamyonlar', 'Birja (OKX)'], wallet: 'Shaxsiy hamyon', cex: 'OKX Birja', okxWhale: 'OKX Kit Hamyoni', newTag: 'YANGI', fallback: 'Hozircha $1M+ bitim topilmadi — zaxira sifatida $100K+ bitimlar ko‘rsatilmoqda; $1M+ bitim kelishi bilan avtomatik almashadi.',
    actions: ['Hammasi', 'Sotib oldi', 'Sotdi'], netAll: 'Barchasi', refresh: 'Yangilash',

    degraded: 'Ba‘zi manbalar (GeckoTerminal / OKX) sekin yoki cheklangan. Saqlangan savdolar ko‘rsatilmoqda, avtomatik qayta uriniladi.',

      inTitle: 'ЗА 3–4 ДНЯ ДЕНЬГИ ЗАХОДЯТ / ПОКУПКА', outTitle: 'ЗА 3–4 ДНЯ ДЕНЬГИ УХОДЯТ / ПРОДАЖА',
      buys: '{n} покупок китов', sells: '{n} продаж китов', span: 'Охват', h: 'ч', d: 'дн', filter: 'Фильтр',

function el(tag, props, ...kids) {

}

function fmtDate(ms) {

}

function fmtCoins(n) {

  if (n >= 1) return n.toLocaleString('en-US', { maximumFractionDigits: 3 });
  if (n >= 0.0001) return n.toPrecision(4);

}

/* Plain fetch() only, with no abort/cancel objects passed in. The timeout is a promise race. */
async function fetchJSON(url, ms) {
  let timer;
  const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), ms || 10000); });
  try {
    const res = await Promise.race([fetch(url), timeout]);
    if (!res.ok) throw new Error(res.status === 429 ? 'rate limited (429)' : 'HTTP ' + res.status);
    return await Promise.race([res.json(), timeout]);
  } finally { clearTimeout(timer); }
}

/* Calls reserve time slots 2.2s apart (~27/min) but run concurrently, so one slow pool never blocks the others. */
let gtNext = 0;
async function gtCall(path) {
  if (Date.now() < gtCooldownUntil) throw new Error('cooldown');
  const now = Date.now();
  const slot = Math.max(now, gtNext);
  gtNext = slot + 2200;
  if (slot > now) await sleep(slot - now);
  if (Date.now() < gtCooldownUntil) throw new Error('cooldown');
  try {
    return await fetchJSON(GT + path, 9000);
  } catch (e) {
    if (/429|timeout|Failed to fetch|NetworkError/i.test(e.message)) gtCooldownUntil = Date.now() + 45000;   // a rate-limited reply often shows up as a CORS-style failure
    throw e;
  }
}

/* ============================================================== pools: GeckoTerminal trending_pools */
function poolFromGT(p, chain) {
  const a = (p && p.attributes) || {};
  const id = (p && p.relationships && p.relationships.base_token && p.relationships.base_token.data && p.relationships.base_token.data.id) || '';
  const vol = a.volume_usd || {};
  return {
    chain, addr: String(a.address || ''), symbol: String(a.name || '').split(' / ')[0].trim() || '?',
    baseAddr: id.includes('_') ? id.slice(id.indexOf('_') + 1) : '',
    liq: num(a.reserve_in_usd), vol1h: num(vol.h1) || num(vol.h24),
  };
}

/* Top-30 pools per network by liquidity. 'quick' = trending list only (fast start); 'full' adds the busiest-pools pages.
   Every request is serialised by gtCall and wrapped in try/catch, so one failure never blocks the rest. */
let discovering = false, fullDone = 0;
async function discoverPools(mode) {
  if (discovering) return;
  discovering = true;
  try {
    const chains = Object.keys(CHAINS);
    const paths = (chain) => {
      const net = CHAINS[chain].gt, list = [`/networks/${net}/trending_pools?duration=1h&page=1`];
      if (mode === 'full') list.push(`/networks/${net}/pools?page=1`, `/networks/${net}/pools?page=2`);
      return list;
    };
    const found = {}; chains.forEach((c) => { found[c] = []; });
    for (const chain of chains) {
      for (const path of paths(chain)) {
        try {
          const j = await gtCall(path);
          for (const p of (j.data || [])) found[chain].push(poolFromGT(p, chain));
        } catch (e) { errors.push(`pools ${chain}: ${e && e.message}`); }
      }
    }
    const picked = {};
    for (const chain of chains) {
      const seen = new Set(pools.filter((p) => p.chain === chain).map((p) => lc(p.addr)));
      const merged = [...pools.filter((p) => p.chain === chain), ...found[chain].filter((p) => p.addr && !seen.has(lc(p.addr)))];
      const uniq = new Map(); merged.forEach((p) => { if (p.addr) uniq.set(lc(p.addr), p.liq >= (uniq.get(lc(p.addr)) || { liq: 0 }).liq ? p : uniq.get(lc(p.addr))); });
      picked[chain] = [...uniq.values()].filter((p) => p.liq >= 300000).sort((a, b) => b.liq - a.liq).slice(0, POOLS_PER_CHAIN);
    }
    const inter = [];
    for (let i = 0; i < POOLS_PER_CHAIN; i++) for (const chain of chains) if (picked[chain][i]) inter.push(picked[chain][i]);
    if (inter.length) { pools = inter; lastDiscovery = Date.now(); if (mode === 'full') fullDone = Date.now(); }
  } finally { discovering = false; }
}

/* ============================================================== trades */
function parseTrades(json, pool) {
  const out = [];
  for (const row of (json && json.data) || []) {
    const a = (row && row.attributes) || {};
    const usd = num(a.volume_in_usd), tx = String(a.tx_hash || ''), ts = Date.parse(a.block_timestamp);
    if (!tx || !(usd >= MIN_USD && usd <= MAX_USD) || !Number.isFinite(ts)) continue;
    const kind = a.kind === 'sell' ? 'sell' : 'buy';
    // amount of the pool's base coin: whichever side of the swap is the base token
    const fromIsBase = pool.baseAddr ? lc(a.from_token_address) === lc(pool.baseAddr) : kind === 'sell';
    const amount = num(fromIsBase ? a.from_token_amount : a.to_token_amount);
    out.push({ key: pool.chain + ':' + tx, chain: pool.chain, symbol: pool.symbol, kind, usd, amount, ts, tx, wallet: String(a.tx_from_address || '') });
  }
  return out;
}

/* ============================================================== AI whale radar: rolling history */
/* The public API only returns ~24h of trades, so every real $10K+ swap this page sees is also kept
   (deduped by tx) in localStorage for 4 days. The radar therefore covers only what was actually observed. */
const HIST_KEY = 'wt_hist', HIST_MS = 4 * 24 * 3600 * 1000, HIST_MAX = 4000;
const hist = new Map();   // key -> [key, ts, chain, symbol, isBuy(1/0), usd]
try {
  const cut = Date.now() - HIST_MS;
  for (const r of JSON.parse(localStorage.getItem(HIST_KEY) || '[]')) if (Array.isArray(r) && r.length === 6 && r[1] >= cut && r[5] >= SMART_MIN) hist.set(r[0], r);
} catch (e) { /* storage unavailable */ }
function saveHist() {
  try {
    const cut = Date.now() - HIST_MS;
    for (const [k, v] of hist) if (v[1] < cut) hist.delete(k);
    if (hist.size > HIST_MAX) { const keep = [...hist.values()].sort((a, b) => b[1] - a[1]).slice(0, HIST_MAX); hist.clear(); for (const r of keep) hist.set(r[0], r); }
    localStorage.setItem(HIST_KEY, JSON.stringify([...hist.values()]));
  } catch (e) { /* quota or storage unavailable */ }
}
function radarData() {
  const now = Date.now(), cut = now - HIST_MS, by = new Map();
  let oldest = now;
  for (const r of hist.values()) {
    if (r[1] < cut || r[5] < SMART_MIN || r[5] > MAX_USD) continue;
    oldest = Math.min(oldest, r[1]);
    const k = String(r[3]).toUpperCase();
    let c = by.get(k); if (!c) { c = { symbol: k, buy: 0, sell: 0, nBuy: 0, nSell: 0 }; by.set(k, c); }
    if (r[4]) { c.buy += r[5]; c.nBuy++; } else { c.sell += r[5]; c.nSell++; }
  }
  const all = [...by.values()];
  const tb = all.reduce((a, c) => a + c.buy, 0), ts = all.reduce((a, c) => a + c.sell, 0);
  all.forEach((c) => { c.pBuy = tb ? c.buy / tb * 100 : 0; c.pSell = ts ? c.sell / ts * 100 : 0; });
  return {
    buys: all.filter((c) => c.buy > 0).sort((a, b) => b.buy - a.buy).slice(0, 5),
    sells: all.filter((c) => c.sell > 0).sort((a, b) => b.sell - a.sell).slice(0, 5),
    hours: hist.size ? (now - oldest) / 3600000 : 0,
  };
}

/* ---- Smart cache: every real $1M-$50M trade seen is kept 48h in localStorage and shown instantly on reload ---- */
function loadCache() {
  try {
    const cut = Date.now() - CACHE_MS;
    for (const r of JSON.parse(localStorage.getItem(CACHE_KEY) || '[]')) {
      if (r && r.key && r.ts >= cut && r.usd >= MIN_USD && r.usd <= MAX_USD) trades.set(r.key, { ...r, cached: true });
    }
  } catch (e) { /* storage unavailable */ }
}
let cacheTimer = 0;
function saveCache() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    try {
      const cut = Date.now() - CACHE_MS;
      const rows = [...trades.values()].filter((r) => r.ts >= cut).sort((a, b) => b.ts - a.ts)
        .slice(0, 2000)
        .map(({ key, chain, symbol, kind, usd, amount, ts, tx, wallet, pair }) => ({ key, chain, symbol, kind, usd, amount, ts, tx, wallet, pair }));
      localStorage.setItem(CACHE_KEY, JSON.stringify(rows));
    } catch (e) { /* quota or storage unavailable */ }
  }, 1500);
}

function addTrades(list) {
  let changed = false;
  const now = Date.now();
  for (const tr of list) {
    const cur = trades.get(tr.key);
    if (!cur) { trades.set(tr.key, { ...tr, fresh: now - tr.ts < 600000 ? now : 0 }); changed = true; }   // YANGI tag only for trades that really just happened          // new: goes straight into the list
    else {
      if (cur.cached) { cur.cached = false; changed = true; }                         // confirmed live by the API again
      if (tr.usd > cur.usd) { trades.set(tr.key, { ...cur, ...tr, cached: false }); changed = true; }
    }
    const h = hist.get(tr.key);
    if (tr.usd >= SMART_MIN && (!h || tr.usd > h[5])) { hist.set(tr.key, [tr.key, tr.ts, tr.chain, tr.symbol, tr.kind === 'buy' ? 1 : 0, tr.usd]); changed = true; }
  }
  if (!changed) return;
  const cutoff = now - CACHE_MS;
  for (const [k, v] of trades) if (v.ts < cutoff) trades.delete(k);
  if (trades.size > 3000) {                                   // keep memory bounded: drop oldest
    const keep = [...trades.values()].sort((a, b) => b.ts - a.ts).slice(0, 2500);
    trades.clear(); for (const x of keep) trades.set(x.key, x);
  }
  version++;
  saveCache();
}

async function fetchPoolTrades(pool) {
  const j = await gtCall(`/networks/${CHAINS[pool.chain].gt}/pools/${encodeURIComponent(pool.addr)}/trades?trade_volume_in_usd_greater_than=${MIN_USD}`);
  lastUpdate = new Date();
  addTrades(parseTrades(j, pool));
  render();                                                    // progressive: show each pool as soon as it lands
}

/* ---- OKX exchange feed ---- */
function parseOkx(json, coin) {
  const rows = ((json && json.data) || []).map((r) => ({ id: String(r.tradeId), px: num(r.px), sz: num(r.sz), side: r.side === 'sell' ? 'sell' : 'buy', ts: num(r.ts) }))
    .filter((r) => r.px > 0 && r.sz > 0 && r.ts > 0).sort((a, b) => a.ts - b.ts || (a.id < b.id ? -1 : 1));
  const full = rows.length >= OKX_LIMIT;
  const groups = [];
  for (const r of rows) {
    const g = groups[groups.length - 1];
    if (g && g.side === r.side && r.ts - g.last <= OKX_GAP_MS) { g.usd += r.px * r.sz; g.amount += r.sz; g.last = r.ts; }
    else groups.push({ side: r.side, id: r.id, ts: r.ts, last: r.ts, usd: r.px * r.sz, amount: r.sz });
  }
  if (full && groups.length) groups.shift();          // oldest group may be cut off by the row limit: skip it
  const out = [];
  for (const g of groups) {
    if (g.usd < MIN_USD || g.usd > MAX_USD) continue;
    out.push({ key: 'okx:' + coin + ':' + g.side + ':' + g.id, chain: 'okx', symbol: coin, kind: g.side, usd: g.usd, amount: g.amount, ts: g.ts, tx: g.id, wallet: '', pair: coin + '-USDT' });
  }
  return out;
}
let okxCooldownUntil = 0;
async function fetchOkx(coin) {            // optional source: never throws, never raises the error banner
  if (Date.now() < okxCooldownUntil) return;
  try {
    const j = await fetchJSON(`${OKX}?instId=${coin}-USDT&limit=${OKX_LIMIT}`, 9000);
    if (j && j.code && j.code !== '0') throw new Error('OKX ' + j.code);
    lastUpdate = new Date();
    addTrades(parseOkx(j, coin));
    render();
  } catch (e) {
    okxCooldownUntil = Date.now() + 300000;           // blocked by CORS / rate limit: pause OKX 5 min, GeckoTerminal keeps running
  }
}

/* ============================================================== refresh cycle */
async function cycle() {
  if (inflight) return;
  inflight = true; errors = [];
  const btn = $('refresh'); if (btn) btn.disabled = true;
  try {
    if (!pools.length) await discoverPools('quick');
    if (Date.now() - fullDone > 600000 && !discovering) discoverPools('full').then(() => render(true), () => {});   // background: busiest pools, every 10 min
    const n = lastUpdate ? TRADES_PER_CYCLE : 6;
    const picks = [];
    for (let i = 0; i < n && pools.length; i++) picks.push(pools[rr++ % pools.length]);
    const res = await Promise.allSettled(picks.map(fetchPoolTrades));   // GeckoTerminal = main source
    res.forEach((r, i) => { if (r.status === 'rejected') errors.push(`trades ${picks[i].chain}: ${r.reason && r.reason.message}`); });
    try { await Promise.allSettled(OKX_COINS.map(fetchOkx)); } catch (e) { /* OKX is optional */ }
  } finally {
    inflight = false;
    saveHist();
    const b = $('refresh'); if (b) b.disabled = false;
    render(true);
  }
}

      el('span', { class: 'fill', style: 'width:' + pct.toFixed(2) + '%' }), el('span', { class: 'amt', text: fmtUsd(r.usd) })),
    el('td', { class: 'mono num' }, fmtCoins(r.amount) + ' ' + r.symbol),
    el('td', { class: 'mono', title: new Date(r.ts).toISOString() }, fmtDate(r.ts)),
    el('td', { class: 'act' }, verifyCell(r)));
}

function logoEl() {
  const d = document.createElement('div');
  d.className = 'logo';
  d.setAttribute('role', 'img'); d.setAttribute('aria-label', 'alimovaura');
  d.append('al', el('span', { class: 'hi', text: 'i' }), 'movaura');   // change which letter is gold here
  return d;
}

const WHALE_SVG = '<svg class="whale" viewBox="0 0 56 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
  '<path fill="#0B0B0B" fill-rule="evenodd" d="M2 21C2 12 11 8 21 8C29 8 35 11 38.5 16C40.5 19 42.5 18.5 43.5 15.5C44.2 13.2 44 11 43 9C41.5 8.6 40.2 7.2 39.5 5C42 5.5 44.5 6.8 46.2 9C47.8 6.8 50.5 5.4 54 5C53 7.4 51.6 8.8 49.6 9.4C49.2 12 48.4 14.5 46.8 17.2C44.5 21 40 23.5 34.5 24C31 27.8 25.5 30 19 30C9 30 2 27 2 21ZM9.4 19.2a1.7 1.7 0 1 0 3.4 0a1.7 1.7 0 1 0-3.4 0Z"/>' +
  '<path fill="#0B0B0B" d="M14.5 1.2h2.2v3.6h-2.2zM10.2 2.8l1.5-1.2l1.9 2.9l-1.7 1.1zM18.6 2.8l-1.5-1.2l-1.9 2.9l1.7 1.1z"/>' +
'</svg>';

function renderChrome() {
  const L = t();
  document.documentElement.lang = state.lang;
  document.title = 'alimovaura';
  const pill = (group, value, label) => el('button', { class: 'pill', type: 'button', 'data-g': group, 'data-v': String(value), 'aria-pressed': String(state[group] === value), text: label });
  const live = el('div', { class: 'live' }, el('span', { class: 'dot' }), el('span', { class: 't', text: 'LIVE ON-CHAIN FEED' }));
  $('hdr').replaceChildren(
    el('div', { class: 'brand' }, logoEl(), (() => { const d = el('div', { class: 'tagline', 'aria-label': L.badge.join(' ') }); d.innerHTML = WHALE_SVG; d.append(el('span', { class: 'ttl' }, el('span', { class: 'w1', text: L.badge[0] }), el('span', { class: 'w2', text: L.badge[1] }), el('span', { class: 'w3', text: L.badge[2] }))); return d; })(), live),
    el('div', { class: 'right' },
      el('div', { class: 'grp lang' }, ...['uz', 'ru', 'en'].map((l) => el('button', { class: 'pill', type: 'button', 'data-lang': l, 'aria-pressed': String(state.lang === l), text: l.toUpperCase() })))));
  $('tools').replaceChildren(
    el('div', { class: 'grp' }, pill('action', 'all', L.actions[0]), pill('action', 'buy', L.actions[1]), pill('action', 'sell', L.actions[2])),
    el('div', { class: 'grp' }, pill('src', 'all', L.sources[0]), pill('src', 'dex', L.sources[1]), pill('src', 'cex', L.sources[2])),
    el('div', { class: 'sep' }),
    el('div', { class: 'grp' }, pill('net', 'all', L.netAll), pill('net', 'solana', 'Solana'), pill('net', 'ethereum', 'Ethereum'), pill('net', 'base', 'Base')),
    el('div', { class: 'sep' }),
    el('div', { class: 'grp' }, pill('size', 'all', '$1M – $50M (Smart Money)'), pill('size', '1_5', '$1M – $5M'), pill('size', '5_15', '$5M – $15M'), pill('size', '15_50', '$15M – $50M'), pill('size', '100k', '$100K+')),
    el('div', { class: 'spacer' }),
    el('button', { class: 'pill sort', id: 'sortToggle', type: 'button', title: state.sort === 'usd' ? L.sort.time : L.sort.usd, text: '⇅ ' + L.sort[state.sort] }),
    el('button', { class: 'gbtn', id: 'refresh', type: 'button', text: L.refresh }));
  $('refresh').disabled = inflight;
  $('head').replaceChildren(...L.cols.map((c, i) => el('th', { class: i === 4 || i === 5 ? 'num' : '', text: c })));
  $('note').textContent = L.note;
}

function fmtSpan(h) {
  const L = t().radar;
  return h < 48 ? Math.max(1, Math.round(h)) + ' ' + L.h : (h / 24).toFixed(1) + ' ' + L.d;
}
const fmtM = (n) => '$' + (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M';
function renderRadar() {
  const L = t().radar, { buys, sells, hours } = radarData();
  const d = new Date(), date = `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
  const head = el('div', { class: 'rhead' },
    el('span', { class: 'rlive' }, el('span', { class: 'rdot' }), el('span', { text: L.live })),
    el('span', { class: 'rtitle' }, el('b', { text: L.title }), ' — ' + L.sub),
    state.coin ? el('button', { class: 'rclear', type: 'button', 'data-coin': '', text: `${L.filter}: ${state.coin} ✕` }) : null,
    el('span', { class: 'rspan', text: hours ? `${L.span}: ${fmtSpan(hours)}` : '' }));
  const col = (kind, list) => {
    const buy = kind === 'in';
    const items = list.length
      ? list.map((c, i) => el('button', { class: 'rcoin' + (state.coin === c.symbol ? ' on' : ''), type: 'button', 'data-coin': c.symbol, title: c.symbol },
          el('span', { class: 'rk', text: '#' + (i + 1) }),
          el('span', { class: 'nm', text: c.symbol }),
          el('span', { class: 'cnt', text: (buy ? L.buys : L.sells).replace('{n}', buy ? c.nBuy : c.nSell) }),
          el('span', { class: 'pct', text: (buy ? c.pBuy : c.pSell).toFixed(1) + '%' }),
          el('span', { class: 'amt ' + (buy ? 'g' : 'r'), text: (buy ? '+' : '−') + fmtM(buy ? c.buy : c.sell) })))
      : [el('div', { class: 'rempty', text: L.empty })];
    return el('div', { class: 'rcol ' + kind }, el('div', { class: 'rcoltitle', text: (buy ? '🟢 ' : '🔴 ') + (buy ? L.inTitle : L.outTitle) }), el('div', { class: 'rlist' }, ...items));
  };
  const kids = [head, el('div', { class: 'rcols' }, col('in', buys), col('out', sells))];
  if (buys.length || sells.length) {
    const win = hours >= 72 ? L.winLong : L.winShort.replace('{span}', fmtSpan(hours));
    let txt = L.sumHead.replace('{date}', date).replace('{win}', win);
    if (buys.length) txt += ' ' + L.sumIn.replace('{coin}', buys[0].symbol).replace('{amt}', '+' + fmtM(buys[0].buy));
    if (sells.length) txt += ' ' + L.sumOut.replace('{coin}', sells[0].symbol).replace('{amt}', '−' + fmtM(sells[0].sell));
    kids.push(el('div', { class: 'rsum', text: txt }));
  }
  $('radar').replaceChildren(...kids);
}

let renderedVersion = -1, renderedKey = '';
function render(force) {
  const key = [state.lang, state.action, state.net, state.size, state.coin, state.sort, errors.length, inflight].join('|');
  if (!force && version === renderedVersion && key === renderedKey) return;
  const L = t();
  const { rows, total, fallback } = visibleRows();
  const tbody = $('rows');
  if (!rows.length) {
    const msg = trades.size ? L.empty : (lastUpdate || errors.length ? (errors.length ? L.none : L.empty) : L.loading);
    tbody.replaceChildren(el('tr', null, el('td', { class: 'empty', colspan: '8', text: msg })));
  } else {
    const max = rows.reduce((m, r) => Math.max(m, r.usd), 0);
    tbody.replaceChildren(...rows.map((r, i) => rowEl(r, i, max)));
  }

  const slow = Date.now() < gtCooldownUntil || errors.length > 0;
  const notice = $('notice');
  const msg2 = [fallback ? L.fallback : '', slow && trades.size ? L.degraded : ''].filter(Boolean).join(' ');
  notice.textContent = msg2;
  notice.className = msg2 ? 'notice show' : 'notice';

  $('statusL').textContent = lastUpdate
    ? `${L.updated} ${pad(lastUpdate.getHours())}:${pad(lastUpdate.getMinutes())}:${pad(lastUpdate.getSeconds())} · ${L.top} ${rows.length} ${L.of} ${total} ${L.unique}` : '';
  const nCached = [...trades.values()].filter((x) => x.cached).length;
  $('statusR').textContent = [lastUpdate ? `${L.src}: GeckoTerminal + OKX` : '', nCached ? `${L.cachedN}: ${nCached}` : ''].filter(Boolean).join(' · ');
  renderRadar();
  renderedVersion = version; renderedKey = key;
}

/* ============================================================== wiring */
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.coin !== undefined) { state.coin = (b.dataset.coin === '' || state.coin === b.dataset.coin) ? '' : b.dataset.coin; render(true); return; }
  if (b.id === 'refresh') { cycle(); return; }
  if (b.id === 'sortToggle') { state.sort = state.sort === 'usd' ? 'time' : 'usd'; renderChrome(); render(true); return; }
  if (b.dataset.lang) { setLang(b.dataset.lang); return; }
  if (b.dataset.g) {
    const g = b.dataset.g;
    state[g] = b.dataset.v;
    renderChrome(); render(true);
  }
});

function setLang(l) {
  if (!I18N[l]) return;
  state.lang = l;
  try { localStorage.setItem('wt_lang', l); } catch (e) { /* ignore */ }
  renderChrome(); render(true);
}

setInterval(() => { if (!document.hidden) cycle(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) cycle(); });

document.documentElement.style.colorScheme = 'light';
renderChrome();
render(true);
cycle();
</script>
